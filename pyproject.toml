[project]
name = "packdate"
version = "0.0.1"
description = "Experimental packaging expiry-date OCR pipeline (assist + confirm)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "packdate authors" }]
keywords = ["ocr", "expiry", "packaging", "open-source"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# RapidOCR >= 3.5 ships the Cyrillic PP-OCRv5 recognition model (docs/research/11).
ocr = ["rapidocr>=3.5", "onnxruntime", "pillow"]
barcode = ["zxing-cpp>=3.1", "pillow"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
